version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      
      - MONGO_URI=${MONGO_URI:-mongodb://127.0.0.1:27017/syncboard}
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80" 
    depends_on:
      - server
    restart: unless-stopped